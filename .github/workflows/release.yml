name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to rebuild and publish (eg. v*.*.*)
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de
        with:
          cache: false

      - name: Run tests
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest                       # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
            archive: fsrt-linux-x86_64.tar.gz
            binary: fsrt

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            archive: fsrt-linux-aarch64.tar.gz
            binary: fsrt

          # - name: macos-x86_64
          #   os: macos-15-intel
          #   archive: fsrt-macos-x86_64.tar.gz
          #   binary: fsrt

          - name: macos-aarch64
            os: macos-latest
            archive: fsrt-macos-aarch64.tar.gz
            binary: fsrt

          - name: windows-x86_64
            os: windows-latest
            archive: fsrt-windows-x86_64.zip
            binary: fsrt.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de
        with:
          cache: false

      - name: Build fsrt
        run: cargo build --profile dist --locked -p fsrt

      - name: Package binary
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir dist
          cp "target/dist/$BINARY" dist/
          cp README.md LICENSE-APACHE LICENSE-MIT dist/
          case "$ARCHIVE" in
            *.zip) (cd dist && 7z a -tzip "../$ARCHIVE" ./*) ;;
            *) tar -czf "$ARCHIVE" -C dist . ;;
          esac

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          persist-credentials: false

      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "FSRT $RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              --draft

          gh release upload "$RELEASE_TAG" artifacts/* --clobber
